<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LearnAI 新手引导</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button>
  <div class="container">
    <div class="card">
      <h2>新手引导</h2>
      <div id="form-message" class="card hidden" style="background:#fff3cd;color:#664d03;"></div>
      <form id="onboarding-form">
        <label>姓名</label>
        <input id="name" type="text" placeholder="请输入姓名" required />
        <label>年级</label>
        <input id="grade" type="text" placeholder="例如 大一" required />
        <label>专业</label>
        <input id="major" type="text" placeholder="请输入专业" required />
        <label>感兴趣学科</label>
        <div>
          <label><input type="checkbox" name="interests" value="理工" /> 理工</label>
          <label><input type="checkbox" name="interests" value="经管" /> 经管</label>
          <label><input type="checkbox" name="interests" value="文史" /> 文史</label>
          <label><input type="checkbox" name="interests" value="公共课" /> 公共课</label>
        </div>
        <label>学习目标</label>
        <select id="goal">
          <option value="期末考试">期末考试</option>
          <option value="考研">考研</option>
          <option value="兴趣">兴趣</option>
          <option value="找工作">找工作</option>
        </select>
        <button type="submit">完成并进入首页</button>
      </form>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script>initOnboardingPage();</script>
</body>
</html>
